<html lang="vi">
<head>

<title>Trắc nghiệm Hán cổ - 3 phần</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f5f1e8;font-family:Arial,sans-serif;color:#1f2937;}
.top-line{height:10px;background:#0f766e;}
.header{padding:35px 60px;background:#f3efe7;border-bottom:1px solid #ddd4c5;}
.header-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.title h1{font-size:46px;margin-bottom:10px;}
.title p{font-size:19px;color:#6b7280;}
.stats{display:flex;gap:12px;flex-wrap:wrap;}
.stat{background:white;border-radius:999px;padding:14px 22px;font-weight:bold;font-size:20px;}
.progress-wrap{margin-top:25px;width:520px;max-width:100%;height:16px;background:#ddd2be;border-radius:999px;overflow:hidden;}
.progress-bar{width:0%;height:100%;background:#9a6a37;transition:.3s;}
.main{padding:35px 60px;}
.toolbar{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:22px;align-items:center;}
.search{flex:1;min-width:250px;}
.search input{width:100%;padding:18px;border-radius:20px;border:2px solid #ddd4c5;font-size:18px;}
.btn{border:none;background:#1f2a44;color:white;border-radius:18px;padding:16px 22px;font-size:18px;font-weight:bold;cursor:pointer;}
.btn.reset{background:#9a6a37;}
.btn.part{background:white;color:#1f2937;border:2px solid #ddd4c5;}
.btn.part.active{background:#0f766e;color:white;border-color:#0f766e;}
.part-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:28px;}
.question{background:#f8f6f1;border:2px solid #ddd4c5;border-radius:30px;padding:30px;margin-bottom:30px;}
.question-title{font-size:30px;line-height:1.7;margin-bottom:25px;}
.question-title .num{color:#9a6a37;font-weight:bold;}
.han{font-size:42px;font-weight:bold;color:#111827;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.option{background:white;border:2px solid #ddd;border-radius:20px;padding:20px;font-size:24px;cursor:pointer;transition:.2s;}
.option:hover{background:#f3f4f6;}
.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534;font-weight:bold;}
.option.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c;}
.result{margin-top:20px;padding:15px 20px;border-radius:16px;font-size:22px;font-weight:bold;display:none;}
.result.correct{background:#dcfce7;color:#166534;}
.result.wrong{background:#fee2e2;color:#b91c1c;}
.hidden{display:none;}
@media(max-width:900px){.header,.main{padding:25px;}.title h1{font-size:32px;}.options{grid-template-columns:1fr;}.option{font-size:20px;}.btn{width:100%;}.han{font-size:34px;}}
</style>
</head>

<div class="top-line"></div>
<div class="header">

      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="stats">

      <div class="stat">Đúng: <span id="correct">0</span></div>
      <div class="stat">Sai: <span id="wrong">0</span></div>
    </div>
  </div>
</div>
<div class="main">
  <div class="part-row">
    <button class="btn part active" onclick="changePart(0,this)">Phần 1</button>

    <button class="btn part" onclick="changePart(2,this)">Phần 3</button>

  <div class="toolbar">
    <div class="search"><input id="searchInput" type="text" placeholder="Tìm chữ Hán hoặc đáp án..." oninput="filterQuestions()"></div>
    <button class="btn" onclick="window.print()">In trang</button>
    <button class="btn" onclick="shuffleCurrentQuestions()">Xáo trộn câu hỏi</button>
    <button class="btn reset" onclick="resetQuiz()">Làm lại</button>
  </div>
  <div id="quiz"></div>
</div>

let currentPart = 0;
let questions = [];
let done = 0, correct = 0, wrong = 0;
let answered = {};

function makeQuestions(list){
  const allAnswers = list.map(x=>x.viet);
  return list.map((item)=>{
    let opts = [item.viet];
    while(opts.length < 4){
      const pick = allAnswers[Math.floor(Math.random()*allAnswers.length)];
      if(!opts.includes(pick)) opts.push(pick);
    }
    opts = shuffle(opts);
    return {q:item.han, correct:item.viet, options:opts};
  });
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function changePart(partIndex,btn){
  currentPart = partIndex;
  document.querySelectorAll('.btn.part').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  resetQuiz();
}
function renderQuiz(){
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  questions.forEach((item,index)=>{
    let html = `<div class="question" data-search="${item.q} ${item.correct}">`;
    html += `<div class="question-title"><span class="num">Câu ${index+1}.</span> <span class="han">${item.q}</span> nghĩa là gì?</div>`;
    html += `<div class="options">`;
    item.options.forEach((opt,i)=>{
      html += `<div class="option" onclick="checkAnswer(this,${index},'${escapeJs(opt)}')">${String.fromCharCode(65+i)}. ${opt}</div>`;
    });
    html += `</div><div class="result" id="result-${index}"></div></div>`;
    quiz.innerHTML += html;
  });
}
function escapeJs(str){ return String(str).replace(/'/g,"&#39;"); }
function checkAnswer(el,qIndex,optText){
  optText = optText.replace(/&#39;/g,"'");
  const resultBox = document.getElementById(`result-${qIndex}`);
  const optionList = el.parentElement.querySelectorAll('.option');
  optionList.forEach(option=>option.classList.remove('wrong'));
  if(optText === questions[qIndex].correct){
    optionList.forEach(option=>option.classList.remove('correct'));
    el.classList.add('correct');
    resultBox.style.display='block';
    resultBox.className='result correct';
    resultBox.innerHTML='✅ Chính xác';
    if(!answered[qIndex]){
      answered[qIndex]=true;
      done++; correct++;
      updateStats();
    }
  }else{
    el.classList.add('wrong');
    resultBox.style.display='block';
    resultBox.className='result wrong';
    resultBox.innerHTML='❌ Sai rồi, hãy chọn lại';
    wrong++;
    updateStats();
    setTimeout(()=>el.classList.remove('wrong'),600);
  }
}
function updateStats(){
  document.getElementById('partName').innerText = currentPart+1;
  document.getElementById('done').innerText = done;
  document.getElementById('correct').innerText = correct;
  document.getElementById('wrong').innerText = wrong;
  document.getElementById('total').innerText = questions.length;
  document.getElementById('progressBar').style.width = ((done/questions.length)*100) + '%';
}
function resetQuiz(){
  done=0; correct=0; wrong=0; answered={};
  questions = makeQuestions(allParts[currentPart]);
  document.getElementById('searchInput').value='';
  renderQuiz(); updateStats();
}
function shuffleCurrentQuestions(){
  questions = shuffle(questions);
  answered={}; done=0; correct=0; wrong=0;
  renderQuiz(); updateStats();
}
function filterQuestions(){
  const key = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.question').forEach(q=>{
    q.classList.toggle('hidden', !q.dataset.search.toLowerCase().includes(key));
  });
}
