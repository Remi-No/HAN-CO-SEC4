<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trắc nghiệm Hán cổ - Từ vựng</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f1e8;font-family:Arial,sans-serif;color:#1f2937}
.top-line{height:10px;background:#0f766e}
.header{padding:34px 6vw;background:#f3efe7;border-bottom:1px solid #ddd4c5}
.header-top{display:flex;justify-content:space-between;gap:22px;flex-wrap:wrap;align-items:flex-start}
.title h1{font-size:clamp(32px,4vw,56px);font-weight:800;margin-bottom:10px;letter-spacing:-1px}
.title p{font-size:clamp(16px,1.6vw,20px);color:#6b7280}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:white;border-radius:999px;padding:14px 22px;font-weight:bold;font-size:18px;border:1px solid #e7dfd2;box-shadow:0 6px 18px rgba(0,0,0,.04)}
.progress-wrap{margin-top:25px;width:560px;max-width:100%;height:16px;background:#ddd2be;border-radius:999px;overflow:hidden}
.progress-bar{width:0%;height:100%;background:#9a6a37;transition:.3s}
.main{padding:34px 6vw}
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.tab{border:none;border-radius:18px;padding:14px 22px;background:#fff;color:#1f2937;font-size:17px;font-weight:700;cursor:pointer;border:1px solid #ddd4c5}
.tab.active{background:#0f766e;color:#fff}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px;align-items:center}
.search{flex:1;min-width:260px}
.search input{width:100%;padding:18px 20px;border-radius:20px;border:2px solid #ddd4c5;font-size:18px;background:white;outline:none}
.btn{border:none;background:#1f2a44;color:white;border-radius:18px;padding:16px 22px;font-size:17px;font-weight:bold;cursor:pointer;transition:.2s}
.btn:hover,.tab:hover{transform:translateY(-1px)}
.btn.reset{background:#9a6a37}
.question{background:#fffefa;border:2px solid #ddd4c5;border-radius:30px;padding:28px;margin-bottom:26px;box-shadow:0 8px 24px rgba(90,60,20,.04)}
.question-title{font-size:26px;line-height:1.7;margin-bottom:22px}
.question-title .num{color:#9a6a37;font-weight:bold}
.han{font-family:"DFKai-SB","BiauKai","KaiTi","STKaiti","標楷體",serif;font-size:46px;line-height:1.35;letter-spacing:3px;color:#000;font-weight:400;vertical-align:middle}
.options{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.option{background:white;border:2px solid #ddd;border-radius:20px;padding:18px;font-size:21px;cursor:pointer;transition:.2s}
.option:hover{background:#f3f4f6}
.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534;font-weight:bold}
.option.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c}
.result{margin-top:18px;padding:14px 18px;border-radius:16px;font-size:20px;font-weight:bold;display:none}
.result.correct{background:#dcfce7;color:#166534}
.result.wrong{background:#fee2e2;color:#b91c1c}
.hidden{display:none}
.footer-note{color:#6b7280;text-align:center;margin:30px 0}
@media(max-width:900px){.header,.main{padding:24px}.options{grid-template-columns:1fr}.option{font-size:19px}.han{font-size:38px}.btn,.tab{width:100%}}
@media print{.toolbar,.tabs,.top-line{display:none}body{background:white}.question{break-inside:avoid}}
</style>
</head>
<body>
<div class="top-line"></div>
<div class="header">
  <div class="header-top">
    <div class="title">
      <h1>Trắc nghiệm Hán cổ - Từ vựng</h1>
      <p>Chia 3 phần từ file PDF. Sai không hiện đáp án đúng, được chọn lại đến khi đúng.</p>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="stats">
      <div class="stat">Phần: <span id="partName">1</span></div>
      <div class="stat">Đã làm: <span id="done">0</span>/<span id="total">0</span></div>
      <div class="stat">Đúng: <span id="correct">0</span></div>
      <div class="stat">Sai: <span id="wrong">0</span></div>
    </div>
  </div>
</div>
<div class="main">
  <div class="tabs">
    <button class="tab active" onclick="selectPart(1,this)">Phần 1</button>
    <button class="tab" onclick="selectPart(2,this)">Phần 2</button>
    <button class="tab" onclick="selectPart(3,this)">Phần 3</button>
    <button class="tab" onclick="selectPart(0,this)">Tất cả</button>
  </div>
  <div class="toolbar">
    <div class="search"><input id="searchInput" type="text" placeholder="Tìm chữ Hán hoặc đáp án..." oninput="filterQuestions()"></div>
    <button class="btn" onclick="window.print()">In trang</button>
    <button class="btn" onclick="shuffleAnswers()">Xáo trộn đáp án</button>
    <button class="btn" onclick="shuffleQuestions()">Xáo trộn câu hỏi</button>
    <button class="btn reset" onclick="resetQuiz()">Làm lại</button>
  </div>
  <div id="quiz"></div>
  <div class="footer-note">Font chữ Hán ưu tiên DFKai-SB / 標楷體 nếu máy có cài đặt.</div>
</div>

const PART_SIZE = Math.ceil(vocabulary.length / 3);
let currentPart = 1;
let currentQuestions = [];
let answered = {};
let done = 0, correct = 0, wrong = 0;

function getPartData(part) {
  if(part === 0) return vocabulary.map((x,i)=>({...x, originalIndex:i}));
  const start = (part-1) * PART_SIZE;
  const end = Math.min(start + PART_SIZE, vocabulary.length);
  return vocabulary.slice(start,end).map((x,i)=>({...x, originalIndex:start+i}));
}

function makeOptions(correctVi) {
  const pool = vocabulary.map(x=>x.vi).filter(v=>v !== correctVi);
  const wrongs = [];
  while(wrongs.length < 3 && pool.length) {
    const idx = Math.floor(Math.random()*pool.length);
    const picked = pool.splice(idx,1)[0];
    if(!wrongs.includes(picked)) wrongs.push(picked);
  }
  return shuffleArray([correctVi, ...wrongs]);
}

function shuffleArray(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function selectPart(part, btn) {
  currentPart = part;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  resetQuiz();
}

function resetQuiz() {
  done = 0; correct = 0; wrong = 0; answered = {};
  currentQuestions = getPartData(currentPart).map((item,idx)=>({
    ...item,
    id: item.originalIndex,
    displayIndex: idx + 1,
    options: makeOptions(item.vi)
  }));
  document.getElementById('searchInput').value = '';
  renderQuiz();
  updateStats();
}

function renderQuiz() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  currentQuestions.forEach((item, index)=>{
    const q = document.createElement('div');
    q.className = 'question';
    q.dataset.search = (item.han + ' ' + item.vi + ' ' + item.options.join(' ')).toLowerCase();
    q.innerHTML = `
      <div class="question-title"><span class="num">Câu ${index+1}.</span> <span class="han">${item.han}</span> nghĩa là gì?</div>
      <div class="options">
        ${item.options.map((opt,i)=>`<div class="option" onclick="checkAnswer(this,${index},'${escapeAttr(opt)}')">${String.fromCharCode(65+i)}. ${opt}</div>`).join('')}
      </div>
      <div class="result" id="result-${index}"></div>
    `;
    quiz.appendChild(q);
  });
}

function escapeAttr(str) {
  return String(str).replace(/'/g,"&#39;").replace(/"/g,"&quot;");
}

function checkAnswer(el, qIndex, selectedText) {
  selectedText = selectedText.replace(/&#39;/g,"'").replace(/&quot;/g,'"');
  const item = currentQuestions[qIndex];
  const resultBox = document.getElementById(`result-${qIndex}`);
  const optionList = el.parentElement.querySelectorAll('.option');

  // Không khóa lựa chọn: mỗi lần bấm đều được kiểm tra lại.
  // Sai không hiện đáp án đúng: xóa toàn bộ màu xanh/đỏ cũ trước khi đánh dấu.
  optionList.forEach(option=>{
    option.classList.remove('wrong');
    option.classList.remove('correct');
  });

  if(selectedText === item.vi) {
    el.classList.add('correct');
    resultBox.style.display = 'block';
    resultBox.className = 'result correct';
    resultBox.innerHTML = '✅ Chính xác';

    if(!answered[item.id]) {
      answered[item.id] = true;
      done++;
      correct++;
      updateStats();
    }
  } else {
    el.classList.add('wrong');
    resultBox.style.display = 'block';
    resultBox.className = 'result wrong';
    resultBox.innerHTML = '❌ Sai rồi, hãy chọn lại';
    wrong++;
    updateStats();
    setTimeout(()=>{ el.classList.remove('wrong'); }, 650);
  }
}

function updateStats() {
  document.getElementById('partName').innerText = currentPart === 0 ? 'Tất cả' : currentPart;
  document.getElementById('done').innerText = done;
  document.getElementById('correct').innerText = correct;
  document.getElementById('wrong').innerText = wrong;
  document.getElementById('total').innerText = currentQuestions.length || getPartData(currentPart).length;
  const total = currentQuestions.length || 1;
  const percent = (done / total) * 100;
  document.getElementById('progressBar').style.width = percent + '%';
}

function shuffleAnswers() {
  currentQuestions = currentQuestions.map(q=>({...q, options: makeOptions(q.vi)}));
  renderQuiz();
  filterQuestions();
}

function shuffleQuestions() {
  currentQuestions = shuffleArray(currentQuestions);
  renderQuiz();
  filterQuestions();
}

function filterQuestions() {
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
  document.querySelectorAll('.question').forEach(q=>{
    q.classList.toggle('hidden', keyword && !q.dataset.search.includes(keyword));
  });
}

resetQuiz();
</script>
